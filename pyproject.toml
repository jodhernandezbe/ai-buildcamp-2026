[project]
name = "ai-buildcamp-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jhernandezbetancur", email = "jhernandezbetancur@anl.gov" }
]
requires-python = ">=3.12"
dependencies = [
    "dirdotenv>=0.0.3",
    "gitsource>=0.0.5",
    "jupyter>=1.1.1",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "markitdown[pdf]>=0.1.8",
    "minsearch==0.0.9",
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.49.0",
    "pymupdf>=1.28.2",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    "toyaikit>=0.0.11",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
